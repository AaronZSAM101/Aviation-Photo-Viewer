# photo-viewer-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: photo-viewer-pod
spec:
  # 进程崩了、健康检查连错 3 次，podman 会重启容器；配合 VM 里的
  # podman-restart.service（见 README 的“开机自动拉起”），机器重启后服务也会自己回来。
  restartPolicy: Always
  containers:
    - name: photo-viewer
      image: localhost/photo-viewer:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          hostPort: 3000
      # podman 把 livenessProbe 翻译成容器健康检查（CMD-SHELL curl -f），
      # 失败到 failureThreshold 就重启容器；readinessProbe podman 不实现，
      # 留着是给真正的 Kubernetes 用的。
      livenessProbe:
        httpGet:
          path: /api/config
          port: 80
        initialDelaySeconds: 30
        periodSeconds: 60
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /api/config
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 30
      env:
        - name: PHOTOS_DIR
          value: /photos
        # 缓存默认写在 <照片库>/.photo_viewer/（2939 张约 96 MB），会跟着 Synology Drive 一起同步。
        # 想让它待在本地盘，下面三处要一起解开注释，而且宿主路径必须写成和容器内路径一模一样那条
        # （ops/backup-state.sh migrate 在宿主上拷文件，PHOTO_VIEWER_CACHE_DIR 是容器里读到的路径，
        # 两边不一致等于把文件拷到容器看不见的地方）。顺序：先 migrate，再改这里，最后 play kube。
        # - name: PHOTO_VIEWER_CACHE_DIR
        #   value: /Users/aaronliu/photo-viewer-cache
        - name: READ_ONLY
          value: "false"
        - name: PHASH_WARMUP
          value: "false"
        - name: SIMILAR_SCAN_WORKERS
          value: "4"
        # 彩绘提醒默认看哪座城市的排班。用户在页面上自己选过一次机场之后就一直跟着他，
        # 这里只兜底第一次打开面板的人。改成别的三字码即可（只能是前端下拉框里有的：
        # PVG/PEK/CAN/SZX/TFU/HGH/PKX/SHA/HKG/NRT/SIN/LHR/FRA/AMS/LAX/JFK），
        # 写错或删掉这一条都退回 SHA。
        - name: LIVERY_DEFAULT_AIRPORT
          value: "SHA"
      volumeMounts:
        - name: photos-volume
          mountPath: /photos
        # 和 PHOTO_VIEWER_CACHE_DIR 同一条路径
        # - name: cache-volume
        #   mountPath: /Users/aaronliu/photo-viewer-cache

  volumes:
    - name: photos-volume
      hostPath:
        path: /Users/aaronliu/Library/CloudStorage/SynologyDrive-Photos/Photos/Aviation
    # - name: cache-volume
    #   hostPath:
    #     path: /Users/aaronliu/photo-viewer-cache
