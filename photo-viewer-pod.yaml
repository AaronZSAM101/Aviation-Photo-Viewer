# photo-viewer-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: photo-viewer-pod
spec:
  # 进程崩了、健康检查连错 3 次，podman 会重启容器；配合 VM 里的
  # podman-restart.service（见 README 的“开机自动拉起”），机器重启后服务也会自己回来。
  restartPolicy: Always
  containers:
    - name: photo-viewer
      image: localhost/photo-viewer:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          hostPort: 3000
      # podman 把 livenessProbe 翻译成容器健康检查（CMD-SHELL curl -f），
      # 失败到 failureThreshold 就重启容器；readinessProbe podman 不实现，
      # 留着是给真正的 Kubernetes 用的。
      livenessProbe:
        httpGet:
          path: /api/config
          port: 80
        initialDelaySeconds: 30
        periodSeconds: 60
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /api/config
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 30
      env:
        - name: PHOTOS_DIR
          value: /photos
        # 状态与缩略图缓存默认写在 <照片库>/.photo_viewer/（2939 张约 96 MB），会跟着
        # Synology Drive 一起同步。想让它待在本地盘，就取消下面两行注释，再给容器挂一个
        # 宿主目录指到 /photo-viewer-cache，然后跑 ops/backup-state.sh migrate 把
        # exif_overrides.json（唯一不能重算的文件）搬过去。
        # - name: PHOTO_VIEWER_CACHE_DIR
        #   value: /photo-viewer-cache
        - name: READ_ONLY
          value: "false"
        - name: PHASH_WARMUP
          value: "false"
        - name: SIMILAR_SCAN_WORKERS
          value: "4"
      volumeMounts:
        - name: photos-volume
          mountPath: /photos

  volumes:
    - name: photos-volume
      hostPath:
        path: /Users/aaronliu/Library/CloudStorage/SynologyDrive-Photos/Photos/Aviation
