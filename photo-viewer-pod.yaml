# photo-viewer-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: photo-viewer-pod
spec:
  containers:
    - name: photo-viewer
      image: localhost/photo-viewer:latest
      ports:
        - containerPort: 80
          hostPort: 3000
      env:
        - name: PHOTOS_DIR
          value: /photos
        - name: READ_ONLY
          value: "false"
        - name: PHASH_WARMUP
          value: "false"
        - name: SIMILAR_SCAN_WORKERS
          value: "4"
      volumeMounts:
        - name: photos-volume
          mountPath: /photos

  volumes:
    - name: photos-volume
      hostPath:
        path: /Users/aaronliu/Library/CloudStorage/SynologyDrive-MBA-Aaron/Photos/Aviation
