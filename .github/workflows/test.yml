name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend cargo test
    runs-on: ubuntu-24.04
    container:
      image: rust:1.91-slim-trixie
    steps:
      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git libimage-exiftool-perl pkg-config
          rm -rf /var/lib/apt/lists/*
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ hashFiles('backend/Cargo.lock') }}
      - name: Test
        run: cargo test --locked --manifest-path backend/Cargo.toml

  frontend:
    name: frontend unit tests and build
    runs-on: ubuntu-24.04
    container:
      image: node:22-alpine
    steps:
      - name: Install git for checkout
        run: apk add --no-cache git
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Type check and build
        working-directory: frontend
        run: npm run build
